<div class="absolute w-full">
  <img src="/images/bg2.jpg" alt="login background" class="w-full h-screen object-cover" />
</div>

<div
  class="w-full md:w-4/12 absolute right-0 left-0 p-8 bg-black/90 my-auto top-1/2 -translate-y-1/2 mx-auto rounded-lg shadow-2xl"
>
  <h1 class="font-bold text-4xl py-6 text-white">Netflix Sign In</h1>

  <form class="space-y-4">
    <div>
      <input
        type="email"
        placeholder="Email or phone number"
        class="w-full px-4 py-3 bg-gray-700 text-white rounded placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600"
      />
    </div>

    <div>
      <input
        type="password"
        placeholder="Password"
        class="w-full px-4 py-3 bg-gray-700 text-white rounded placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600"
      />
    </div>

    <button
      type="button"
      class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded transition duration-300"
    >
      Sign In
    </button>
  </form>

  <div class="flex items-center my-6">
    <div class="flex-1 border-t border-gray-600"></div>
    <span class="px-3 text-gray-400 text-sm">OR</span>
    <div class="flex-1 border-t border-gray-600"></div>
  </div>

  <button
    id="google-btn"
    class="w-full bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 rounded flex items-center justify-center gap-2 transition duration-300"
    type="button"
    (click)="signInWithGoogle()"
  >
    <span>🔐</span> Sign in with Google
  </button>

  <p class="text-gray-400 text-sm mt-6">
    New to Netflix? <span class="text-white cursor-pointer hover:underline">Sign up now</span>
  </p>
</div>
